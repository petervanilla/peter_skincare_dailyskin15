<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>DailySkin 15 - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Source+Serif+4:wght@600;700;900&amp;display=swap" rel="stylesheet">

        tailwind.config = {

                      "secondary-fixed-dim": "#b3ccc1",
                      "outline-variant": "#bfc9c5",
                      "surface-bright": "#faf9f5",
                      "surface": "#faf9f5",
                      "on-background": "#1b1c1a",
                      "pure-white": "#FFFFFF",
                      "secondary-fixed": "#cfe8dc",
                      "primary-fixed-dim": "#97d2c4",
                      "tertiary-fixed": "#e6deff",
                      "on-tertiary": "#ffffff",
                      "surface-variant": "#e3e2df",
                      "on-tertiary-fixed": "#1d045c",

                      "tertiary": "#3d2d7b",
                      "primary": "#004339",
                      "inverse-primary": "#97d2c4",
                      "on-secondary-container": "#536960",
                      "surface-container-high": "#e9e8e4",
                      "outline": "#707976",

                      "stack-sm": "8px",
                      "stack-md": "16px",
                      "margin-main": "24px",

                      "gutter": "16px"
              },
              "fontFamily": {
                      "body-md": [

                      "headline-lg": [

                      ],

                      ],

<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
.chip-active {
    background-color: theme("colors.primary-container");
    color: theme("colors.pure-white");
    border-color: theme("colors.primary-container")
    }
.chip-active .material-symbols-outlined {
    color: theme("colors.pure-white") !important
    }
.chip-inactive {
    background-color: rgba(255, 255, 255, 0.4);
    color: theme("colors.on-surface");
    border-color: theme("colors.primary-container")
    }
.bg-image-wrapper {
    background-image: url(https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg);
    background-size: cover;
    background-position: center;
    background-attachment: fixed
    }</style>
</head>
<body class="bg-image-wrapper min-h-screen text-on-background font-body-md antialiased pb-safe-area-bottom">
<div class="min-h-screen w-full backdrop-blur-[20px] bg-white/30">
<!-- Top Navigation (Back button for flow) -->
<header class="flex justify-between items-center w-full px-margin-main py-4 z-10 sticky top-0 bg-transparent">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-80 transition-opacity flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-[900] text-2xl font-headline-lg text-primary-container tracking-wider uppercase absolute left-1/2 -translate-x-1/2">Daily Skin 15</span>
<div class="w-8"></div> <!-- Spacer for centering -->
</header>
<main class="px-margin-main pt-stack-md pb-stack-lg max-w-md mx-auto flex flex-col min-h-[calc(100vh-80px-34px)]">
<!-- Progress Bar -->
<div class="w-full bg-surface-variant/50 h-1 rounded-full mb-stack-lg overflow-hidden backdrop-blur-sm">
<div class="bg-primary h-full rounded-full w-2/6 transition-all duration-500 ease-out"></div>
</div>
<!-- Header Section -->
<div class="mb-stack-lg">
<h1 class="font-display-hero-mobile text-display-hero-mobile md:font-display-hero md:text-display-hero text-primary mb-stack-sm tracking-tight leading-tight drop-shadow-sm">
                당신에 대해 알려주세요
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed font-medium drop-shadow-sm">
                가장 신경 쓰이는 피부 고민은 무엇인가요?<br>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1 inline-block">(복수 선택 가능)</span>
</p>
</div>
<!-- Survey Options (Multi-select Pills) -->
<div class="grid grid-cols-2 gap-x-gutter gap-y-3 flex-grow">
<button class="chip-inactive border hover:bg-white/60 transition-colors duration-200 rounded-xl py-4 px-4 flex flex-col items-center justify-center text-center shadow-[0_8px_32px_rgba(0,0,0,0.05)] backdrop-blur-md h-28" onclick="this.classList.toggle('chip-active'); this.classList.toggle('chip-inactive');">
<span class="material-symbols-outlined text-[40px] mb-2 text-primary-container opacity-90 font-light transition-colors" data-icon="medical_services">medical_services</span>
<span class="font-label-bold text-label-bold">트러블</span>
</button>
<button class="chip-inactive border hover:bg-white/60 transition-colors duration-200 rounded-xl py-4 px-4 flex flex-col items-center justify-center text-center shadow-[0_8px_32px_rgba(0,0,0,0.05)] backdrop-blur-md h-28" onclick="this.classList.toggle('chip-active'); this.classList.toggle('chip-inactive');">
<span class="material-symbols-outlined text-[40px] mb-2 text-primary-container opacity-90 font-light transition-colors" data-icon="water_drop">water_drop</span>
<span class="font-label-bold text-label-bold">붉은기</span>
</button>
<button class="chip-inactive border hover:bg-white/60 transition-colors duration-200 rounded-xl py-4 px-4 flex flex-col items-center justify-center text-center shadow-[0_8px_32px_rgba(0,0,0,0.05)] backdrop-blur-md h-28" onclick="this.classList.toggle('chip-active'); this.classList.toggle('chip-inactive');">
<span class="material-symbols-outlined text-[40px] mb-2 text-primary-container opacity-90 font-light transition-colors" data-icon="blur_on">blur_on</span>
<span class="font-label-bold text-label-bold">잡티/주근깨</span>
</button>
<button class="chip-inactive border hover:bg-white/60 transition-colors duration-200 rounded-xl py-4 px-4 flex flex-col items-center justify-center text-center shadow-[0_8px_32px_rgba(0,0,0,0.05)] backdrop-blur-md h-28" onclick="this.classList.toggle('chip-active'); this.classList.toggle('chip-inactive');">
<span class="material-symbols-outlined text-[40px] mb-2 text-primary-container opacity-90 font-light transition-colors" data-icon="air">air</span>
<span class="font-label-bold text-label-bold">피부결</span>
</button>
<button class="chip-inactive border hover:bg-white/60 transition-colors duration-200 rounded-xl py-4 px-4 flex flex-col items-center justify-center text-center shadow-[0_8px_32px_rgba(0,0,0,0.05)] backdrop-blur-md h-28" onclick="this.classList.toggle('chip-active'); this.classList.toggle('chip-inactive');">
<span class="material-symbols-outlined text-[40px] mb-2 text-primary-container opacity-90 font-light transition-colors" data-icon="insights">insights</span>
<span class="font-label-bold text-label-bold">주름</span>
</button>
<button class="chip-inactive border hover:bg-white/60 transition-colors duration-200 rounded-xl py-4 px-4 flex flex-col items-center justify-center text-center shadow-[0_8px_32px_rgba(0,0,0,0.05)] backdrop-blur-md h-28" onclick="this.classList.toggle('chip-active'); this.classList.toggle('chip-inactive');">
<span class="material-symbols-outlined text-[40px] mb-2 text-primary-container opacity-90 font-light transition-colors" data-icon="auto_awesome">auto_awesome</span>
<span class="font-label-bold text-label-bold">탄력</span>
</button>
</div>
<!-- Bottom Action -->
<div class="mt-stack-lg pt-stack-md w-full">
<button class="w-full text-pure-white font-label-bold text-label-bold py-4 rounded-full hover:opacity-90 transition-opacity shadow-lg shadow-primary-container/30 flex items-center justify-center gap-2 bg-primary-container">
                다음
                <span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
</div>
</body></html>
