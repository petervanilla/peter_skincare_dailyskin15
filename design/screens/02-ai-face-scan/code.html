<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>DailySkin 15 - Face Scan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Source+Serif+4:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#091f18",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#536960",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1b1c1a",
                        "surface-tint": "#2e685d",
                        "tertiary-fixed-dim": "#cbbeff",
                        "on-secondary-fixed-variant": "#354b43",
                        "surface-container-highest": "#e3e2df",
                        "primary-fixed": "#b3eee0",
                        "surface-container-low": "#f5f4f0",
                        "secondary-fixed": "#cfe8dc",
                        "on-tertiary-fixed": "#1d045c",
                        "secondary-fixed-dim": "#b3ccc1",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#e6deff",
                        "primary": "#004339",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#544594",
                        "surface-variant": "#e3e2df",
                        "on-primary-container": "#96d1c2",
                        "on-tertiary-fixed-variant": "#493a89",
                        "on-tertiary-container": "#c9bcff",
                        "surface-container-high": "#e9e8e4",
                        "pure-white": "#FFFFFF",
                        "secondary-container": "#cfe8dc",
                        "inverse-primary": "#97d2c4",
                        "inverse-surface": "#30312e",
                        "secondary": "#4d635a",
                        "graphite": "#202026",
                        "primary-container": "#1f5b50",
                        "background": "#faf9f5",
                        "outline-variant": "#bfc9c5",
                        "surface-container": "#efeeea",
                        "on-primary-fixed-variant": "#105045",
                        "on-background": "#1b1c1a",
                        "on-error-container": "#93000a",
                        "outline": "#707976",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface": "#faf9f5",
                        "glass-overlay": "rgba(255, 255, 255, 0.7)",
                        "on-surface-variant": "#404946",
                        "inverse-on-surface": "#f2f1ed",
                        "on-primary-fixed": "#00201b",
                        "primary-fixed-dim": "#97d2c4",
                        "surface-bright": "#faf9f5",
                        "surface-dim": "#dbdad6",
                        "error": "#ba1a1a",
                        "tertiary": "#3d2d7b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "32px",
                        "margin-main": "24px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "safe-area-bottom": "34px"
                    },
                    "fontFamily": {
                        "headline-lg": ["\"Source Serif 4\""],
                        "body-md": ["Hanken Grotesk"],
                        "display-hero": ["\"Source Serif 4\""],
                        "label-bold": ["Hanken Grotesk"],
                        "display-hero-mobile": ["\"Source Serif 4\""],
                        "label-sm": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-hero": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display-hero-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Scanning Animation Styles */
        .scan-ring {
            box-shadow: 0 0 0 4px rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }
        .scan-active {
            box-shadow: 0 0 0 4px rgba(203, 190, 255, 0.8), 0 0 20px rgba(203, 190, 255, 0.5);
        }
        
        .pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body class="bg-graphite text-pure-white h-screen w-screen overflow-hidden flex flex-col relative font-body-md antialiased selection:bg-tertiary-fixed selection:text-on-tertiary-fixed">
<!-- Camera Feed Background (Placeholder) -->
<div class="absolute inset-0 w-full h-full z-0 object-cover" data-alt="A close-up portrait of a young woman with clear skin, facing directly at the camera. The lighting is soft, even, and natural, typical of a clinical but friendly beauty diagnostic scan. The background is slightly blurred and neutral." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDIJxTCAABdx2NO9xsV3yHIHt9WR35OvfaguVNH4HiddNFUWz37snJu17QDFTubTMAi1rqD4dYHwPb6Cd4nm1KpUoyfQY9YqjIgjyI_-YbDwao-6ic3YWjefejgdc_G2D8vuiw0V4jbgw1YwZu767ZlbbQ6jgNoV3zKh0QX8VB_qvQaFy_osrIaoS4ev6-bvA5_aZaOStFrp6vVWVgaCCpgc53AXCfbkmRfHmzBOYQ-R4GVURVrnpf9nw'); background-position: center; background-size: cover;">
</div>
<!-- Top Navigation / Progress (Glassmorphism) -->
<header class="relative z-10 w-full px-margin-main py-safe-area-bottom pt-12 flex flex-col items-center gap-stack-md bg-gradient-to-b from-graphite/60 to-transparent">
<!-- Close Button -->
<button class="absolute left-margin-main top-12 w-10 h-10 rounded-full bg-glass-overlay backdrop-blur-md flex items-center justify-center text-graphite hover:bg-pure-white transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-pure-white drop-shadow-md">Face Scan</h1>
<!-- Step Indicator -->
<div class="flex items-center gap-2 mt-2 w-full max-w-[280px] mx-auto justify-between">
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center font-label-bold text-label-bold">1</div>
<span class="font-label-sm text-label-sm text-pure-white drop-shadow-sm">Front</span>
</div>
<div class="h-[2px] flex-1 bg-pure-white/30 rounded-full mx-1"></div>
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full bg-glass-overlay backdrop-blur-sm text-graphite flex items-center justify-center font-label-bold text-label-bold">2</div>
<span class="font-label-sm text-label-sm text-pure-white/70 drop-shadow-sm">Left</span>
</div>
<div class="h-[2px] flex-1 bg-pure-white/30 rounded-full mx-1"></div>
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full bg-glass-overlay backdrop-blur-sm text-graphite flex items-center justify-center font-label-bold text-label-bold">3</div>
<span class="font-label-sm text-label-sm text-pure-white/70 drop-shadow-sm">Right</span>
</div>
<!-- Simplifying to 3 visible steps for UI balance on mobile, though prompt mentions 5 -->
<div class="h-[2px] flex-1 bg-pure-white/30 rounded-full mx-1"></div>
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full bg-glass-overlay backdrop-blur-sm text-graphite flex items-center justify-center font-label-bold text-label-bold">4</div>
<span class="font-label-sm text-label-sm text-pure-white/70 drop-shadow-sm">Up</span>
</div>
</div>
</header>
<!-- Main Scanning Area -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-margin-main pointer-events-none">
<!-- Alignment Guide -->
<div class="relative w-[280px] h-[380px] rounded-[140px] border-2 border-pure-white/60 border-dashed flex items-center justify-center mb-8 scan-ring" id="face-guide">
<!-- Subtle corner markers could go here if needed, keeping it minimal for now -->
</div>
<!-- Feedback Text -->
<div class="bg-glass-overlay backdrop-blur-xl rounded-full px-6 py-3 mt-stack-md flex items-center gap-2 pointer-events-auto">
<span class="material-symbols-outlined text-primary text-xl">info</span>
<p class="font-label-bold text-label-bold text-graphite">얼굴을 원 안에 맞춰주세요</p>
</div>
<p class="font-body-md text-pure-white/80 mt-2 text-center drop-shadow-md">Align your face within the circle</p>
</main>
<!-- Bottom Controls -->
<footer class="relative z-10 w-full px-margin-main pb-[50px] pt-8 bg-gradient-to-t from-graphite/80 to-transparent flex flex-col items-center">
<!-- Capture Button -->
<div class="relative flex items-center justify-center w-24 h-24">
<!-- Outer Ring -->
<div class="absolute inset-0 rounded-full border-[3px] border-pure-white/40"></div>
<!-- Inner Button -->
<button class="w-[72px] h-[72px] rounded-full bg-tertiary-fixed hover:bg-tertiary-fixed-dim transition-all duration-200 active:scale-95 flex items-center justify-center shadow-[0_0_20px_rgba(203,190,255,0.4)]" id="capture-btn">
<!-- Inner solid circle to mimic iOS camera style slightly but customized -->
<div class="w-14 h-14 rounded-full bg-tertiary-container shadow-inner"></div>
</button>
</div>
</footer>
<!-- Interactive Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const captureBtn = document.getElementById('capture-btn');
            const faceGuide = document.getElementById('face-guide');
            const feedbackText = document.querySelector('.backdrop-blur-xl p');
            const feedbackIcon = document.querySelector('.backdrop-blur-xl span');
            
            // Simulate finding a face after a moment
            setTimeout(() => {
                faceGuide.classList.add('scan-active');
                feedbackText.textContent = "Perfect. Hold still.";
                feedbackText.classList.replace('text-graphite', 'text-primary');
                feedbackIcon.textContent = "check_circle";
                
                // Add pulsing effect to button to indicate readiness
                captureBtn.parentElement.classList.add('pulse');
            }, 2500);

            captureBtn.addEventListener('click', () => {
                // Flash effect
                const flash = document.createElement('div');
                flash.className = 'fixed inset-0 bg-pure-white z-50 transition-opacity duration-300 pointer-events-none';
                document.body.appendChild(flash);
                
                // Remove flash
                setTimeout(() => {
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 300);
                }, 100);
                
                // Simulate processing
                captureBtn.innerHTML = '<span class="material-symbols-outlined text-pure-white animate-spin">sync</span>';
                
            });
        });
    </script>
</body></html>
