<script>
        // Simple slider logic for the before/after comparison
        const slider = document.getElementById('split-handle');
        const leftImg = document.getElementById('img-left-container');
        const rightImg = document.getElementById('img-right-container');
        const container = slider.parentElement;

        let isDragging = false;

        slider.addEventListener('mousedown', () => isDragging = true);
        slider.addEventListener('touchstart', () => isDragging = true, {passive: true});

        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('touchend', () => isDragging = false);

        const moveSlider = (clientX) => {
            if (!isDragging) return;
            const rect = container.getBoundingClientRect();
            let x = clientX - rect.left;
            
            // Constrain
            if (x < 0) x = 0;
            if (x > rect.width) x = rect.width;

            const percentage = (x / rect.width) * 100;
            
            slider.style.left = `${percentage}%`;
            leftImg.style.clipPath = `polygon(0 0, ${percentage}% 0, ${percentage}% 100%, 0 100%)`;
            rightImg.style.clipPath = `polygon(${percentage}% 0, 100% 0, 100% 100%, ${percentage}% 100%)`;
        };

        window.addEventListener('mousemove', (e) => moveSlider(e.clientX));
        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                // Prevent scrolling while dragging slider
                e.preventDefault(); 
            }
            moveSlider(e.touches[0].clientX);
        }, {passive: false});
    </script>
